services:
  # Backend API & MCP Server
  - type: web
    name: rebur-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: DEFAULT_WORKSPACE_ID
        value: ws_demo_123
      - key: DATABASE_URL
        value: sqlite:///./expenses.db
      - key: MAX_AUTO_APPROVAL_AMOUNT_INR
        value: "5000.0"
      - key: MAX_AUTO_APPROVAL_AMOUNT_USD
        value: "100.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  # Frontend Web Dashboard
  - type: web
    name: rebur-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: rebur-backend
          property: host

